name: probe aces
on: { push: { branches: [probe/aces-403] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            curl -s -A "Mozilla/5.0 Chrome/130" -o ical.ics -w "ical %{http_code}\n" https://www.meetup.com/acesintexas/events/ical/
            grep -E "^(SUMMARY|DTSTART|LOCATION)" ical.ics | head -60
            curl -s -A "Mozilla/5.0 Chrome/130" -o ev.html -w "events page %{http_code}\n" https://www.meetup.com/acesintexas/events/
            grep -oiE "open play[^\"<]{0,80}" ev.html | sort | uniq -c | head
          } > out.txt 2>&1
          python3 -c "import sys;t=open('out.txt').read().replace('%','%25').replace('\r','').replace('\n','%0A');[print('::warning title=p%d::'%i+t[j:j+3500]) for i,j in enumerate(range(0,len(t),3500))]"
