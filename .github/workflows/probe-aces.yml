name: probe aces
on: { push: { branches: [probe/aces-403] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://acesintexas.com/wednesday-indoor-open-plays-volleyworld-pflugerville/
          echo "runner ip: $(curl -s https://api.ipify.org)"
          for ua in "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" "curl/8"; do
            echo "== UA: $ua"; curl -s -D - -o body.html -A "$ua" -H "Accept: text/html" -H "Accept-Language: en-US" "$U" | head -25; head -c 400 body.html; echo; done
          for p in / /robots.txt /wp-json/ /feed/ ; do printf "%s %s\n" "$(curl -s -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 Chrome/130' https://acesintexas.com$p)" "$p"; done
          echo "== dns"; getent hosts acesintexas.com; curl -s "https://ipinfo.io/$(getent hosts acesintexas.com | awk '{print $1}' | head -1)/json"
