name: Refresh schedules

on:
  schedule:
    # Hourly, 6:13am to 12:13am Austin time (CDT; an hour earlier in winter).
    # Consumers (e.g. vteam) pull data/occurrences.json from GitHub Pages after each run;
    # hourly runs clear last-minute cancellations within the hour.
    # GitHub drops most of these when it's busy, so .github/workflows/scrape-clock.yml starts
    # this workflow every hour itself; this schedule is only a backup (the clock skips an hour
    # when a scrape already started in it).
    - cron: '13 11-23,0-5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Per job, so an auto-fix still running doesn't hold up the next hour's scrape.
    concurrency: scrape
    outputs:
      fixable: ${{ steps.changes.outputs.fixable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The last run's data (for keep-last-good and change detection) is on the data branch.
      - name: Load the latest data
        run: scripts/data-branch.sh pull
      # Schelagg's database (Neon). Without the DATABASE_URL secret this is a notice and the
      # scrape publishes the JSON files only. A database problem never stops the scrape: a
      # failed migration shows here, and a failed write goes in the source-failed issue.
      - name: Migrate the database
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/db-migrate.mjs
      - run: npm run scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # To the data branch, never main: a push to main is a Vercel deployment.
      - name: Commit updated data
        run: |
          git config user.name "volley-atx-bot"
          git config user.email "volley-atx-bot@users.noreply.github.com"
          scripts/data-branch.sh push "Refresh schedules $(date -u +'%F %H:%MZ')"
      - name: Open an issue if a source failed, close it when all recover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs hourly: keep one open issue per outage instead of one per run. Issues are
          # assigned to the repo owner, which notifies them even if they don't watch the repo.
          open=$(gh issue list --state open --search 'in:title "Schedule scrape: source failed"' --json number --jq '.[0].number')
          if [ -s scrape-failures.md ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file scrape-failures.md
            else
              gh issue create --title "Schedule scrape: source failed $(date -u +%F)" --body-file scrape-failures.md --assignee "$GITHUB_REPOSITORY_OWNER"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Every source scraped successfully on $(date -u +'%F %H:%MZ')."
          fi
      - name: Open an issue if a source changed what it sends
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # lib/health.js writes only changes not reported before, so this stays quiet until
          # something new happens. Not closed automatically: someone has to adjust for it.
          if [ -s scrape-changes.md ]; then
            open=$(gh issue list --state open --search 'in:title "Schedule scrape: source changed"' --json number --jq '.[0].number')
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file scrape-changes.md
            else
              gh issue create --title "Schedule scrape: source changed $(date -u +%F)" --body-file scrape-changes.md --assignee "$GITHUB_REPOSITORY_OWNER"
            fi
            # Hand-checked sessions need a person; auto-fix only starts for source findings.
            if [ "$(jq '[.[] | select(.source != "manual")] | length' scrape-changes.json)" -gt 0 ]; then
              echo "fixable=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Hand the new changes to the auto-fix job
        if: steps.changes.outputs.fixable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scrape-changes
          path: |
            scrape-changes.md
            scrape-changes.json
          retention-days: 7

  # Right after a scrape that noticed something new in a source, Claude Code tries to adapt to
  # it (instructions: .github/autofix-prompt.md). .github/autofix-finish.sh then merges the fix
  # if every gate passes (tests, site e2e, a live re-run of the scrape that shows the problem
  # gone) and otherwise opens a pull request for review. Needs the CLAUDE_CODE_OAUTH_TOKEN
  # secret (`claude setup-token`, valid for a year); skipped without it.
  autofix:
    needs: scrape
    if: needs.scrape.outputs.fixable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: autofix
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write # start a fresh scrape after merging a fix
      id-token: write
    steps:
      - name: Check for the Claude token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::CLAUDE_CODE_OAUTH_TOKEN isn't set; skipping auto-fix."; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          ref: main
          fetch-depth: 50
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: npm ci && npx playwright install --with-deps chromium
      # The data the scrape job just committed (and its history, for the verification baseline).
      - name: Load the latest data
        if: steps.token.outputs.present == 'true'
        run: git fetch -q --depth=50 origin data && scripts/data-branch.sh pull
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.present == 'true'
        with:
          name: scrape-changes
      - name: Claude adapts to the change
        id: claude
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: Read .github/autofix-prompt.md and follow it. The new findings are in scrape-changes.md.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,Bash(npm test),Bash(node --test:*),Bash(node scripts/inspect-source.mjs:*),Bash(node scripts/sanitize-fixtures.mjs)"
      - name: Say so on the issue if Claude couldn't run
        if: steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --state open --search 'in:title "Schedule scrape: source changed"' --json number --jq '.[0].number')
          msg="Auto-fix couldn't run Claude Code: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          If the log shows an authentication error, the CLAUDE_CODE_OAUTH_TOKEN secret has probably expired (it lasts a year). Run \`claude setup-token\` and update the secret in Settings → Secrets and variables → Actions."
          [ -n "$issue" ] && gh issue comment "$issue" --body "$msg"
          exit 1
      - name: Merge the fix if every gate passes, otherwise open a pull request
        if: steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        # The committed copy, not the working tree Claude could have edited.
        run: git show HEAD:.github/autofix-finish.sh > "$RUNNER_TEMP/autofix-finish.sh" && bash "$RUNNER_TEMP/autofix-finish.sh"
