name: Refresh schedules

on:
  schedule:
    # Hourly, 6:13am to 12:13am Austin time (CDT; an hour earlier in winter).
    # vteam hides synced sessions older than 12h, so the overnight gap is safe;
    # hourly runs clear last-minute cancellations within the hour.
    - cron: '13 11-23,0-5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run scrape
      - name: Commit updated data
        run: |
          git config user.name "volley-atx-bot"
          git config user.email "volley-atx-bot@users.noreply.github.com"
          git add public/data/schedule.json data/watch.json
          git diff --cached --quiet || git commit -m "Refresh schedules $(date -u +'%F %H:%MZ')"
          git pull --rebase --quiet && git push
      - name: Push sessions to vteam
        # Skips itself when VTEAM_SERVICE_ROLE_KEY isn't configured. The project
        # URL is public (it ships in vteam's web bundle), so it isn't a secret.
        env:
          VTEAM_SUPABASE_URL: https://rmelsdqgrpfjzqisycdl.supabase.co
          VTEAM_SERVICE_ROLE_KEY: ${{ secrets.VTEAM_SERVICE_ROLE_KEY }}
        run: node scripts/sync-vteam.mjs
      - name: Open an issue if a source failed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Runs hourly: keep one open issue per outage instead of one per run.
          if [ -s scrape-failures.md ]; then
            open=$(gh issue list --state open --search 'in:title "Schedule scrape: source failed"' --json number --jq '.[0].number')
            if [ -n "$open" ]; then
              gh issue comment "$open" --body-file scrape-failures.md
            else
              gh issue create --title "Schedule scrape: source failed $(date -u +%F)" --body-file scrape-failures.md
            fi
          fi
