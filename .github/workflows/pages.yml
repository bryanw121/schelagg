name: Deploy site

# Rebuilds the court calendars and publishes the site to GitHub Pages: on every push to main and
# after each schedule refresh, which starts this with workflow_dispatch (scrape.yml, "Deploy the
# site"). Not workflow_run: GitHub doesn't fire it for refreshes the scrape clock started with the
# workflow token, which is most of them. The safety cron covers a refresh whose dispatch failed.
# The site is main's code with the latest scrape output from the data branch laid over it.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 */2 * * *' # every 2 hours, in case a dispatch was missed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load the latest data
        run: scripts/data-branch.sh pull
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch live court calendars
        run: node scripts/build-courts.mjs
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      # The Map view's map (public/maps): cut once a month, or when the venues move, and cached in
      # between; a failure only hides the Map button (scripts/build-maps.mjs).
      - id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: maps-cache
        uses: actions/cache@v4
        with:
          path: public/maps
          key: maps-${{ steps.month.outputs.month }}-${{ hashFiles('config/regions/*/region.json', 'config/regions/*/venues.json', 'scripts/build-maps.mjs', 'lib/map-area.js') }}
      - name: Build the maps
        if: steps.maps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          gh release download -R protomaps/go-pmtiles -p '*Linux_x86_64.tar.gz' -O "$RUNNER_TEMP/pmtiles.tgz"
          tar xzf "$RUNNER_TEMP/pmtiles.tgz" -C "$RUNNER_TEMP" pmtiles
          node scripts/build-maps.mjs --pmtiles "$RUNNER_TEMP/pmtiles" --maxzoom 14
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
