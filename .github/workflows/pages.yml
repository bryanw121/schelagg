name: Deploy site

# Rebuilds the court calendars and publishes the site to GitHub Pages: every 15 minutes,
# on every push to main, and right after each schedule refresh. The site is main's code
# with the latest scrape output from the data branch laid over it.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_run:
    workflows: [Refresh schedules]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load the latest data
        run: scripts/data-branch.sh pull
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Fetch live court calendars
        run: node scripts/build-courts.mjs
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
