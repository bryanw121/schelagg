name: Add a source
# Someone used "Add a source" on the site and the check passed (api/add-source.js): that opens an
# issue labelled add-source with the repository owner's token. This runs the same check again
# from here and commits the config change; the next refresh reads the new source.
# Issues from anyone else are ignored: only the owner's token can start this.
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: add-source
  cancel-in-progress: false
jobs:
  add:
    if: contains(github.event.issue.labels.*.name, 'add-source') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check again and write the config
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          node scripts/add-source.mjs > "$RUNNER_TEMP/result.json"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/result.json"
      - name: Test, commit and push
        if: steps.add.outputs.code == '0'
        run: |
          if git diff --quiet; then echo "Nothing to change."; exit 0; fi
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config
          git commit -m "Add a source (#${{ github.event.issue.number }})"
          git push origin HEAD:main
      - name: Say what happened and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          CODE: ${{ steps.add.outputs.code }}
          OUTCOME: ${{ job.status }}
        run: |
          f="$RUNNER_TEMP/result.json"
          msg=$(node -e 'try{const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(`${r.title} ${r.detail??""}${r.changed===false&&r.status==="ok"?" (already in the config)":""}`)}catch{console.log("The check did not finish.")}' "$f")
          if [ "$CODE" = "0" ] && [ "$OUTCOME" = "success" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" --comment "$msg"
          else
            gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "Not added from here: $msg"
          fi
