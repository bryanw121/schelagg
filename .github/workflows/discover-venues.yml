name: Discover venues

# Weekly (and on demand): for each sport, find venues around Austin in OpenStreetMap (and Google
# Places when GOOGLE_PLACES_API_KEY is set), classify where each publishes its schedule, and commit
# the new venues straight to main — no review pull requests (the owner doesn't review them; the
# script's own checks are the gate: a venue has to have a readable schedule surface, and the
# hourly scrape opens an issue if a new source breaks). See scripts/discover.mjs and #21.
on:
  schedule:
    - cron: '27 14 * * 1' # Mondays, 9:27am CDT
  workflow_dispatch:
    inputs:
      sport:
        description: Sport (blank for all)
        required: false

permissions:
  contents: write

concurrency: discover-venues

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Discover and commit
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ONLY: ${{ inputs.sport }}
        run: |
          git config user.name "volley-atx-bot"
          git config user.email "volley-atx-bot@users.noreply.github.com"
          git checkout -q -B main "$GITHUB_SHA"
          sports=$(jq -r '.sports | keys[]' config/discovery.json)
          [ -n "$ONLY" ] && sports="$ONLY"
          # Every region (config/regions/<id>/) × every sport: commit new venues straight to main.
          for region in $(ls config/regions); do
            [ -f "config/regions/$region/region.json" ] || continue
            name=$(jq -r '.name // .id' "config/regions/$region/region.json")
            for sport in $sports; do
              node scripts/discover.mjs "$sport" "$region" --apply || { echo "::warning::$region/$sport discovery failed"; continue; }
              if git diff --quiet -- config/regions; then
                echo "$region/$sport: nothing new"
                continue
              fi
              git commit -qm "Discovered $sport venues in $name" -- config/regions
              git push -q origin main || { echo "::error::$region/$sport: git push failed"; failed=1; }
            done
          done
          exit ${failed:-0}
