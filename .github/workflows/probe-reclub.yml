name: Probe Reclub competitions (temporary)
on:
  push:
    branches: [probe/reclub-comps]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node probe/reclub-comps.mjs
