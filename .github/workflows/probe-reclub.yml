name: Probe Reclub competitions (temporary)
on:
  push:
    branches: [probe/reclub-comps]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node probe/reclub-comps.mjs
      - run: |
          git config user.name volley-atx-bot; git config user.email volley-atx-bot@users.noreply.github.com
          git add probe/vex && git commit -qm 'Vex pages' && git push -q origin HEAD:probe/vex-pages -f
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: vex, path: vex.png }
