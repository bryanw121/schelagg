<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>Texas Asian Olympics — Volleyball</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description"
          content="Official site for the Texas Asian Olympics Volleyball event. Register your team, view schedules, rules, venue info, FAQs, and contact details."/>
    <link rel="stylesheet" href="/styles.css?v=20260913-1">

    <style>
        /* ===== Cream + Texas Orange ===== */
        :root{ --bg:#FAF7F2; --fg:#2c2c2c; --muted:#6b5e52; --accent:#BF5700; --accent-2:#4B8F8C; --border:#e0d9cf; --card:#ffffff; --shadow:0 8px 24px rgba(0,0,0,.08); --ring:0 0 0 3px rgba(191,87,0,.25); }
        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0; font-family:Inter,-apple-system, Segoe UI, Roboto, Arial, sans-serif; color:var(--fg);
            background:
            radial-gradient(800px 400px at -10% -10%, rgba(191,87,0,.05), transparent 60%),
            radial-gradient(900px 500px at 110% -10%, rgba(75,143,140,.05), transparent 60%),
            var(--bg);
            -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
        }
        a{color:var(--accent); text-decoration:none}
        a:hover{text-decoration:underline}
        .container{max-width:1200px; margin:0 auto; padding:1.25rem}

        /* ===== Keep layout from shifting between pages ===== */
        html{ scrollbar-gutter: stable both-edges; }
        @supports not (scrollbar-gutter: stable){ html{ overflow-y: scroll; } }

        /* ===== Hero video ===== */
        .hero{
            position:relative; overflow:clip; text-align:center; border-bottom:1px solid var(--border);
            min-height:clamp(560px,85svh,1000px); padding:5rem 1rem 3rem;
            background: linear-gradient(180deg, rgba(191,87,0,.06), rgba(250,247,242,0) 70%), var(--bg);
        }
        .hero::before{
            content:""; position:absolute; inset:0; pointer-events:none;
            background:url("assets/home-page-poster.508ee341.jpg") center 35%/cover no-repeat;
            filter:blur(2px) saturate(1.05); opacity:.32; transform:scale(1.02);
            transition:opacity .45s ease; z-index:0;
        }
        .hero.video-ready::before{opacity:0}
        .hero-video-bg{
            position:absolute; inset:0; width:100%; height:100%;
            object-fit:cover; object-position:center 35%;
            filter:blur(2px) saturate(1.05); opacity:0; transform:scale(1.02);
            transition:opacity .45s ease; z-index:0;
        }
        .hero-video-bg.is-ready{opacity:.32}
        @media (prefers-reduced-motion:reduce){ .hero-video-bg{display:none} }

        .hero .container{position:relative; z-index:2}
        .hero h1{margin:0 0 .6rem; color:#1a1a1a; font-size:clamp(2.3rem,5.4vw,4rem); letter-spacing:.2px}
        .muted{color:var(--muted)}
        .event-location{margin:.75rem 0 0; line-height:1.5}
        .venue-name{display:block; color:var(--fg); font-size:1.05rem; font-weight:750}
        .venue-address{display:block; margin-top:.2rem; color:var(--muted); font-size:.94rem}
        .chips{margin:1rem auto 0; display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap}

        /* chip */
        .chip{
            backdrop-filter:blur(10px); background:rgba(255,255,255,.65);
            border:1px solid var(--border); padding:.45rem .7rem;
            border-radius:999px; font-size:.88rem; box-shadow:var(--shadow);
            font-weight:600;
        }
        .chip.countdown{
            display:inline-flex; justify-content:center; min-width:clamp(190px,55vw,210px);
            padding:.3rem .6rem; font-size:.76rem;
            font-variant-numeric:tabular-nums;
        }
        .cta-row{margin-top:1.1rem; display:inline-flex; gap:.6rem; flex-wrap:wrap}
        .btn{display:inline-block; padding:.85rem 1.1rem; border-radius:14px; font-weight:700; border:none; cursor:pointer; transition:transform .08s, box-shadow .2s, filter .2s}
        .btn.primary{background:var(--accent); color:#fff; box-shadow:0 6px 20px rgba(191,87,0,.22)}
        .btn.primary:hover{filter:brightness(1.05); box-shadow:0 10px 26px rgba(191,87,0,.28)}
        .btn.secondary{background:var(--accent-2); color:#fff; box-shadow:0 6px 20px rgba(75,143,140,.22)}
        .btn.secondary:hover{filter:brightness(1.05); box-shadow:0 10px 26px rgba(75,143,140,.30)}

        footer{background:#fff; border-top:1px solid var(--border)}
        small{color:#4b5563}
    </style>
</head>

<body>

<!-- Header mount (content is injected from header.html) -->
<header id="site-header" role="banner"></header>

<section class="hero">
    <!-- Background video -->
    <video class="hero-video-bg" muted loop playsinline preload="none"
           poster="assets/home-page-poster.508ee341.jpg" aria-hidden="true" tabindex="-1">
        <source data-src="assets/home-page-bg-video.9d2495b9.mp4" type="video/mp4">
    </video>

    <div class="container">
        <span class="chip countdown" id="event-countdown"
              aria-label="Countdown to the tournament">Loading countdown…</span>

        <h1>Texas Asian Olympics 🤠</h1>
        <p class="event-location">
            <strong class="venue-name">Children's Health StarCenter Multisport Northlake</strong>
            <span class="venue-address">13850 Chadwick Pkwy, Northlake, TX 76262</span>
        </p>

        <div class="chips">
            <span class="chip">Nov 14 - 15, 2026</span>
            <span class="chip">3 Divisions</span>
            <span class="chip">400+ Players</span>
        </div>

        <div class="cta-row">
            <a class="btn primary" href="registration/">Register Here</a>
            <a class="btn secondary" href="schedule/">View Schedule</a>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <small>© 2026 Texas Asian Olympics • Volleyball</small>
    </div>
</footer>

<!-- Load shared header AFTER DOM so the mount exists -->
<script>
    // Load the decorative video after the page is ready. Visitors who prefer
    // reduced motion or have data-saving enabled keep the lightweight poster.
    (function () {
        const video = document.querySelector('.hero-video-bg');
        const source = video && video.querySelector('source[data-src]');
        if (!video || !source) return;

        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const saveData = Boolean(navigator.connection && navigator.connection.saveData);
        if (reducedMotion || saveData) return;

        video.addEventListener('playing', () => {
            video.classList.add('is-ready');
            video.closest('.hero')?.classList.add('video-ready');
        }, { once: true });

        const loadVideo = () => {
            source.src = source.dataset.src;
            video.load();
            video.play().catch(() => {
                // The poster remains visible if autoplay is blocked.
            });
        };

        if ('requestIdleCallback' in window) {
            requestIdleCallback(loadVideo, { timeout: 800 });
        } else {
            setTimeout(loadVideo, 0);
        }
    })();

    // Tournament countdown: Nov 14, 2026 at 1:00 PM Central Standard Time.
    (function () {
        const countdown = document.getElementById('event-countdown');
        if (!countdown) return;

        const eventTime = new Date('2026-11-14T13:00:00-06:00').getTime();
        const pad = value => String(value).padStart(2, '0');
        let timer;

        function updateCountdown() {
            const remaining = eventTime - Date.now();

            if (remaining <= 0) {
                countdown.textContent = 'Event started!';
                if (timer) clearInterval(timer);
                return;
            }

            const days = Math.floor(remaining / 86400000);
            const hours = Math.floor((remaining % 86400000) / 3600000);
            const minutes = Math.floor((remaining % 3600000) / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);

            countdown.textContent = `Starts in ${days}d ${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
        }

        updateCountdown();
        timer = setInterval(updateCountdown, 1000);
        document.addEventListener('visibilitychange', updateCountdown);
    })();

</script>
<script src="/header.js" defer></script>

</body>
</html>
